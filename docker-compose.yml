services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: meeplemind-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: meeplemind-frontend
    ports:
      - "8502:8502"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: meeplemind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

  locust:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: meeplemind-locust
    ports:
      - "8089:8089"
    command: locust -f scripts/locustfile.py --host http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_storage:
